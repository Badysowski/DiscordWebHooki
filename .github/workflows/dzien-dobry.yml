name: Dzień dobry

on:
  schedule:
    # Dwa wpisy celuja w te sama godzine 8:30 czasu polskiego po obu stronach zmiany czasu.
    # Robote wykonuje ten, ktory wpada w okno 8:30 +graceMinutes (src/window.js); latem drugi jest dogrywka.
    # Bramka idempotencji w src/main.js pilnuje, zeby wyslac tylko raz dziennie.
    - cron: '30 6 * * *'  # 8:30 czasu letniego (CEST)
    - cron: '30 7 * * *'  # 8:30 czasu zimowego (CET)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tylko pokaz co by wyslal, nie wysylaj'
        type: boolean
        default: false

concurrency:
  group: dzien-dobry
  cancel-in-progress: false

permissions:
  contents: write   # potrzebne do zapisu state.json z licznikiem serii

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdz kanal i odezwij sie
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WATCHED_USER_ID: ${{ secrets.DISCORD_WATCHED_USER_ID }}
          WATCHED_USER_NAME: ${{ secrets.WATCHED_USER_NAME }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TENOR_API_KEY: ${{ secrets.TENOR_API_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          node src/main.js \
            ${{ github.event_name == 'workflow_dispatch' && '--now' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Zapisz licznik serii
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "budzik-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && { echo "Stan bez zmian."; exit 0; }
          git commit -m "Seria: $(date -u +%Y-%m-%d)"
          # dwa boty commituja o tej samej porze — rebase na to, co juz jest na main
          git pull --rebase --autostash -q
          git push
